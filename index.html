<body>
  <div class="container">
    <h1>Draw something, then ask the model to describe it</h1>
    <div class="disclaimer">Requires <strong>Chrome 148+</strong> with the on-device Prompt API enabled (multimodal input). Desktop only, ~22 GB free disk, GPU with &gt;4 GB VRAM.</div>
    <div class="callout">ℹ️ If you want to check it out without running it, <a href="https://www.youtube.com/shorts/xOee9p-N4zw" target="_blank" rel="noopener">watch this video</a>.</div>

    <div class="canvas-wrap">
      <canvas id="canvas" width="900" height="600"></canvas>
    </div>

    <div class="toolbar">
      <label>Brush
        <input type="range" id="brush" min="1" max="40" value="4">
      </label>
      <label>Color
        <input type="color" id="color" value="#000000">
      </label>
      <label>Output language
        <select id="lang">
          <option value="en">English (en)</option>
          <option value="ja">Japanese (ja)</option>
          <option value="es">Spanish (es)</option>
          <option value="pt">Portuguese (pt)</option>
        </select>
      </label>
      <button id="clear">Clear</button>
      <button id="upload-btn" type="button">Select image</button>
      <input type="file" id="upload" accept="image/*" style="display:none">
      <label>Load example
        <select id="example-select">
          <option value="">—</option>
          <option value="example1.png">Example 1</option>
          <option value="example2.png">Example 2</option>
          <option value="example3.png">Example 3</option>
        </select>
      </label>
      <button id="describe">Describe the image</button>
      <button id="stop" disabled>Stop</button>
      <span class="status" id="status"></span>
    </div>

    <div id="progress-wrap">
      <progress id="progress" value="0" max="1"></progress>
      <div id="progress-label"></div>
    </div>

    <div id="output">Output will appear here.</div>

    <details class="settings">
      <summary>Model settings</summary>
      <div class="settings-grid">
        <label class="full" title="Sent as initialPrompts with role=system. Persists across the whole session and is never dropped on context overflow. Changing this rebuilds the session.">
          <span class="name">System prompt</span>
          <span class="hint">Persona/instructions sent once at session start (<code>initialPrompts[role=system]</code>). Never dropped on context overflow.<br>Example: <code>You are a friendly art critic. Be concise.</code></span>
          <textarea id="set-system">Describe this hand-drawn image in a couple of sentences.</textarea>
        </label>

        <label title="Extra text added to the user message alongside the canvas image. Leave empty to rely on the system prompt.">
          <span class="name">User prompt text</span>
          <span class="hint">Optional extra instruction sent in the user turn (with the image).<br>Example: <code>Focus on the colors and composition.</code></span>
          <input type="text" id="set-prompt" placeholder="(optional — leave empty to rely on system prompt)">
        </label>

        <label title="Pre-fills the start of the assistant's reply. Useful to force a specific format. Sent as a trailing assistant message with prefix:true.">
          <span class="name">Assistant response prefix</span>
          <span class="hint">Forces the model to continue from this text (<code>prefix: true</code>).<br>Example: <code>```json\n{"description":"</code></span>
          <input type="text" id="set-prefix" placeholder="optional, e.g. ```json{">
        </label>

        <label title="Sampling temperature — higher = more random. Must be set together with topK or both left blank. Default and max come from LanguageModel.params().">
          <span class="name">Temperature</span>
          <span class="hint">Sampling randomness. Higher = more creative.<br>Typical: <code>0.7</code> · default: <code>1.0</code> · max: <code>2.0</code>. Must be set together with topK.</span>
          <input type="number" id="set-temperature" step="0.1" min="0" placeholder="leave blank for default">
        </label>

        <label title="Top-K sampling — picks among the K most likely tokens at each step. Must be set together with temperature.">
          <span class="name">topK</span>
          <span class="hint">Sample from the K most likely tokens.<br>Typical: <code>3</code>–<code>40</code> · default: <code>3</code> · max: <code>128</code>. Must be set together with temperature.</span>
          <input type="number" id="set-topk" step="1" min="1" placeholder="leave blank for default">
        </label>

        <label title="Adds {type:'audio'} to expectedInputs. Required if you ever pass audio Blobs/AudioBuffers to prompt(). Note: audio input requires a GPU.">
          <span class="name">Audio in expectedInputs</span>
          <span class="hint">Declare audio support at session creation. Required for audio inputs; needs a GPU.<br>Example: <code>{ type: "audio" }</code></span>
          <select id="set-audio">
            <option value="no">No</option>
            <option value="yes">Yes (requires GPU)</option>
          </select>
        </label>

        <label title="promptStreaming() returns a ReadableStream of partial text. prompt() resolves once with the full result.">
          <span class="name">Response delivery</span>
          <span class="hint">Streaming shows partial text as it generates; non-streaming waits for the full reply.<br>API: <code>session.promptStreaming()</code> vs <code>session.prompt()</code></span>
          <select id="set-stream">
            <option value="yes">promptStreaming()</option>
            <option value="no">prompt()</option>
          </select>
        </label>

        <label class="full" title="JSON Schema enforcing the response shape. Passed as responseConstraint on prompt(). The output will be parseable JSON matching this schema.">
          <span class="name">responseConstraint (JSON Schema)</span>
          <span class="hint">Forces structured output matching this schema.<br>Example: <code>{"type":"object","properties":{"summary":{"type":"string"},"objects":{"type":"array","items":{"type":"string"}}},"required":["summary","objects"]}</code></span>
          <textarea id="set-schema" placeholder='{"type":"object","properties":{"summary":{"type":"string"}},"required":["summary"]}'></textarea>
        </label>

        <label class="checkbox full" title="If checked, the schema is enforced on output but not included in the prompt's context window. Add guidance about the desired shape in the prompt text instead.">
          <input type="checkbox" id="set-omit-constraint">
          <span>
            <span class="name">omitResponseConstraintInput</span>
            <span class="hint"> — saves context tokens; describe the JSON shape in your prompt instead.</span>
          </span>
        </label>
      </div>
      <div class="settings-actions">
        <button id="set-load-params" type="button">Load defaults from params()</button>
        <button id="set-reset-session" type="button">Reset session</button>
        <span class="status" id="params-info"></span>
      </div>
    </details>

  </div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const brushEl = document.getElementById('brush');
const colorEl = document.getElementById('color');
const clearBtn = document.getElementById('clear');
const describeBtn = document.getElementById('describe');
const output = document.getElementById('output');
const statusEl = document.getElementById('status');
const langEl = document.getElementById('lang');
const progressWrap = document.getElementById('progress-wrap');
const progressEl = document.getElementById('progress');
const progressLabel = document.getElementById('progress-label');
const stopBtn = document.getElementById('stop');
const setSystem = document.getElementById('set-system');
const setPrompt = document.getElementById('set-prompt');
const setPrefix = document.getElementById('set-prefix');
const setTemperature = document.getElementById('set-temperature');
const setTopK = document.getElementById('set-topk');
const setAudio = document.getElementById('set-audio');
const setStream = document.getElementById('set-stream');
const setSchema = document.getElementById('set-schema');
const setOmitConstraint = document.getElementById('set-omit-constraint');
const setLoadParams = document.getElementById('set-load-params');
const setResetSession = document.getElementById('set-reset-session');
const paramsInfo = document.getElementById('params-info');

ctx.fillStyle = '#fff';
ctx.fillRect(0, 0, canvas.width, canvas.height);
ctx.lineCap = 'round';
ctx.lineJoin = 'round';

let drawing = false;
let last = null;

function pos(e) {
  const r = canvas.getBoundingClientRect();
  const p = e.touches ? e.touches[0] : e;
  const sx = canvas.width / r.width;
  const sy = canvas.height / r.height;
  return { x: (p.clientX - r.left) * sx, y: (p.clientY - r.top) * sy };
}

function start(e) {
  e.preventDefault();
  drawing = true;
  last = pos(e);
}
function move(e) {
  if (!drawing) return;
  e.preventDefault();
  const p = pos(e);
  ctx.strokeStyle = colorEl.value;
  ctx.lineWidth = parseInt(brushEl.value, 10);
  ctx.beginPath();
  ctx.moveTo(last.x, last.y);
  ctx.lineTo(p.x, p.y);
  ctx.stroke();
  last = p;
}
function end() { drawing = false; last = null; }

canvas.addEventListener('mousedown', start);
canvas.addEventListener('mousemove', move);
window.addEventListener('mouseup', end);
canvas.addEventListener('touchstart', start);
canvas.addEventListener('touchmove', move);
canvas.addEventListener('touchend', end);

clearBtn.addEventListener('click', () => {
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
});

const uploadBtn = document.getElementById('upload-btn');
const uploadInput = document.getElementById('upload');
uploadBtn.addEventListener('click', () => uploadInput.click());
uploadInput.addEventListener('change', () => {
  const file = uploadInput.files && uploadInput.files[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    // contain-fit
    const cw = canvas.width, ch = canvas.height;
    const ratio = Math.min(cw / img.width, ch / img.height);
    const w = img.width * ratio, h = img.height * ratio;
    const x = (cw - w) / 2, y = (ch - h) / 2;
    ctx.drawImage(img, x, y, w, h);
    URL.revokeObjectURL(url);
    log('image loaded onto canvas', { name: file.name, type: file.type, size: fmtBytes(file.size), w: img.width, h: img.height });
    uploadInput.value = '';
  };
  img.onerror = () => {
    URL.revokeObjectURL(url);
    log('image load failed', { name: file.name });
  };
  img.src = url;
});

const exampleSelect = document.getElementById('example-select');
exampleSelect.addEventListener('change', async () => {
  const file = exampleSelect.value;
  if (!file) return;
  try {
    const resp = await fetch(file);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const blob = await resp.blob();
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => {
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      const cw = canvas.width, ch = canvas.height;
      const ratio = Math.min(cw / img.width, ch / img.height);
      const w = img.width * ratio, h = img.height * ratio;
      const x = (cw - w) / 2, y = (ch - h) / 2;
      ctx.drawImage(img, x, y, w, h);
      URL.revokeObjectURL(url);
      log('example loaded onto canvas', { file, w: img.width, h: img.height, size: fmtBytes(blob.size) });
    };
    img.onerror = () => { URL.revokeObjectURL(url); log('failed to decode example', { file }); };
    img.src = url;
  } catch (e) {
    log('failed to fetch example', { file, error: e.message });
  } finally {
    exampleSelect.value = '';
  }
});

function fmtBytes(n) {
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
  return (n / 1024 / 1024).toFixed(2) + ' MB';
}

function ts() {
  const d = new Date();
  return d.toTimeString().slice(0, 8) + '.' + String(d.getMilliseconds()).padStart(3, '0');
}

const debugEl = document.createElement('pre');
debugEl.id = 'debug';
document.querySelector('.container').appendChild(debugEl);

function log(msg, data) {
  const line = `[${ts()}] ${msg}` + (data !== undefined ? ' ' + JSON.stringify(data) : '');
  debugEl.textContent += line + '\n';
  debugEl.scrollTop = debugEl.scrollHeight;
  console.log(line);
}

function setStatus(s) { statusEl.textContent = s; }

if (window.marked) {
  marked.setOptions({ breaks: true, gfm: true });
}
function renderMarkdown(md) {
  if (!window.marked || !window.DOMPurify) {
    output.textContent = md;
    return;
  }
  const html = marked.parse(md);
  output.innerHTML = DOMPurify.sanitize(html);
}

function showProgress(loaded) {
  progressWrap.style.display = 'block';
  progressEl.value = loaded;
  progressLabel.textContent = `Downloading Gemini Nano… ${(loaded * 100).toFixed(1)}%`;
}
function hideProgress() {
  progressWrap.style.display = 'none';
}

function describeError(err) {
  const out = { name: err.name, message: err.message };
  // QuotaExceededError exposes requested + contextWindow per the spec
  if ('requested' in err) out.requested = err.requested;
  if ('contextWindow' in err) out.contextWindow = err.contextWindow;
  if ('quota' in err) out.quota = err.quota;
  return out;
}

let session = null;
let sessionKey = null;
let cachedParams = null;

function buildSessionConfig(language) {
  const officiallySupported = new Set(['en', 'ja', 'es']);
  const declaredOutputLang = officiallySupported.has(language) ? language : 'en';

  const expectedInputs = [
    { type: 'text', languages: ['en'] },
    { type: 'image' },
  ];
  if (setAudio.value === 'yes') expectedInputs.push({ type: 'audio' });

  const opts = {
    expectedInputs,
    expectedOutputs: [{ type: 'text', languages: [declaredOutputLang] }],
  };

  const sys = setSystem.value.trim();
  if (sys) {
    opts.initialPrompts = [{ role: 'system', content: sys }];
  }

  const tempStr = setTemperature.value.trim();
  const topKStr = setTopK.value.trim();
  // Spec: must specify both or neither.
  if (tempStr !== '' && topKStr !== '') {
    opts.temperature = Number(tempStr);
    opts.topK = Number(topKStr);
  } else if (tempStr !== '' || topKStr !== '') {
    log('temperature/topK must be set together — ignoring partial values');
  }

  return { opts, declaredOutputLang, requestedLang: language };
}

function configKey(cfg) {
  return JSON.stringify({
    inputs: cfg.opts.expectedInputs,
    outputs: cfg.opts.expectedOutputs,
    initialPrompts: cfg.opts.initialPrompts || null,
    temperature: cfg.opts.temperature ?? null,
    topK: cfg.opts.topK ?? null,
  });
}

async function getSession(language) {
  const cfg = buildSessionConfig(language);
  const key = configKey(cfg);
  if (session && sessionKey === key) return session;
  if (session) {
    log('settings changed, destroying old session');
    try { session.destroy(); } catch {}
    session = null;
  }

  if (!('LanguageModel' in self)) {
    throw new Error('LanguageModel API not available. Use Chrome (desktop, 22GB+ free, GPU >4GB VRAM) with the Prompt API enabled at chrome://flags/#prompt-api-for-gemini-nano-multimodal-input.');
  }
  log('LanguageModel detected');
  if (cfg.declaredOutputLang !== cfg.requestedLang) {
    log('output language not in supported set; declaring en, steering via prompt', { requested: cfg.requestedLang });
  }

  if (LanguageModel.availability) {
    setStatus('Checking availability…');
    const avail = await LanguageModel.availability(cfg.opts);
    log('availability', avail);
    if (avail === 'unavailable') {
      throw new Error(`Model unavailable for these settings (lang="${language}"). Check hardware requirements and chrome://on-device-internals.`);
    }
    if (avail === 'downloadable' || avail === 'downloading') {
      setStatus('Model needs to download…');
      showProgress(0);
    }
  }

  if (LanguageModel.params && !cachedParams) {
    try {
      cachedParams = await LanguageModel.params();
      log('params', cachedParams);
      paramsInfo.textContent = `defaults: temp=${cachedParams.defaultTemperature}, topK=${cachedParams.defaultTopK} · max temp=${cachedParams.maxTemperature}, max topK=${cachedParams.maxTopK}`;
    } catch (e) { log('params error', e.message); }
  }

  setStatus('Creating session…');
  log('create() start', {
    outputLanguage: language,
    temperature: cfg.opts.temperature ?? '(default)',
    topK: cfg.opts.topK ?? '(default)',
    hasSystemPrompt: !!cfg.opts.initialPrompts,
    audioInput: setAudio.value === 'yes',
  });
  const t0 = performance.now();
  let lastLogged = -1;
  session = await LanguageModel.create({
    ...cfg.opts,
    monitor(m) {
      m.addEventListener('downloadprogress', (e) => {
        showProgress(e.loaded);
        setStatus(`Downloading model… ${(e.loaded * 100).toFixed(1)}%`);
        const pct = Math.floor(e.loaded * 100);
        if (pct !== lastLogged) {
          lastLogged = pct;
          log('downloadprogress', { loaded: e.loaded, percent: pct });
        }
      });
    },
  });
  hideProgress();
  sessionKey = key;
  log('create() done', { ms: Math.round(performance.now() - t0) });
  if ('inputQuota' in session) {
    log('quota', { inputQuota: session.inputQuota, inputUsage: session.inputUsage });
  }
  if ('contextWindow' in session) {
    log('context', { contextUsage: session.contextUsage, contextWindow: session.contextWindow });
  }

  session.addEventListener?.('contextoverflow', () => {
    log('contextoverflow event — earlier turns dropped');
  });

  setStatus('');
  return session;
}

let activeController = null;
stopBtn.addEventListener('click', () => {
  if (activeController) {
    log('user clicked Stop — aborting');
    activeController.abort();
  }
});

setResetSession.addEventListener('click', () => {
  if (session) {
    try { session.destroy(); } catch {}
    log('session destroyed by user');
  }
  session = null;
  sessionKey = null;
  setStatus('Session reset');
});

setLoadParams.addEventListener('click', async () => {
  if (!('LanguageModel' in self) || !LanguageModel.params) {
    log('params() unavailable');
    return;
  }
  try {
    cachedParams = await LanguageModel.params();
    setTemperature.value = cachedParams.defaultTemperature;
    setTopK.value = cachedParams.defaultTopK;
    paramsInfo.textContent = `defaults: temp=${cachedParams.defaultTemperature}, topK=${cachedParams.defaultTopK} · max temp=${cachedParams.maxTemperature}, max topK=${cachedParams.maxTopK}`;
    log('loaded defaults from params()', cachedParams);
  } catch (e) {
    log('params() error', e.message);
  }
});

describeBtn.addEventListener('click', async () => {
  describeBtn.disabled = true;
  stopBtn.disabled = false;
  output.innerHTML = '';
  let accumulated = '';
  const language = langEl.value;
  activeController = new AbortController();
  try {
    const s = await getSession(language);

    setStatus('Encoding canvas…');
    const tEnc = performance.now();
    const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
    log('canvas encoded', { type: blob.type, size: fmtBytes(blob.size), ms: Math.round(performance.now() - tEnc) });

    const langName = { en: 'English', ja: 'Japanese', es: 'Spanish', pt: 'Portuguese' }[language] || language;
    const userExtra = setPrompt.value.trim();
    const userText = (userExtra ? userExtra + ' ' : '') + `Respond in ${langName}.`;

    const prompt = [{
      role: 'user',
      content: [
        { type: 'text', value: userText },
        { type: 'image', value: blob },
      ],
    }];

    const prefixText = setPrefix.value;
    if (prefixText) {
      prompt.push({ role: 'assistant', content: prefixText, prefix: true });
      log('using assistant prefix', { length: prefixText.length });
    }

    const promptOptions = { signal: activeController.signal };
    const schemaText = setSchema.value.trim();
    if (schemaText) {
      try {
        promptOptions.responseConstraint = JSON.parse(schemaText);
        if (setOmitConstraint.checked) promptOptions.omitResponseConstraintInput = true;
        log('using responseConstraint', { omitFromContext: !!setOmitConstraint.checked });
      } catch (e) {
        throw new Error('Invalid JSON Schema in responseConstraint: ' + e.message);
      }
    }

    if (s.measureInputUsage) {
      try {
        const usage = await s.measureInputUsage(prompt, promptOptions);
        log('measureInputUsage tokens', usage);
      } catch (e) { log('measureInputUsage error', e.message); }
    }

    const useStreaming = setStream.value === 'yes';
    setStatus(useStreaming ? 'Sending prompt (streaming)…' : 'Sending prompt…');
    log(useStreaming ? 'promptStreaming() start' : 'prompt() start');
    const tPrompt = performance.now();

    if (useStreaming) {
      const stream = await s.promptStreaming(prompt, promptOptions);
      setStatus('Streaming response…');
      let firstChunkAt = null;
      let chunks = 0;
      let chars = 0;
      for await (const chunk of stream) {
        if (firstChunkAt === null) {
          firstChunkAt = performance.now();
          log('first chunk', { ttfbMs: Math.round(firstChunkAt - tPrompt) });
        }
        chunks++;
        chars += chunk.length;
        accumulated += chunk;
        renderMarkdown(accumulated);
      }
      log('stream done', { totalMs: Math.round(performance.now() - tPrompt), chunks, chars });
    } else {
      const result = await s.prompt(prompt, promptOptions);
      accumulated = result;
      renderMarkdown(accumulated);
      log('prompt() done', { totalMs: Math.round(performance.now() - tPrompt), chars: result.length });
    }

    if ('inputUsage' in s) log('post-call usage', { inputUsage: s.inputUsage, inputQuota: s.inputQuota });
    if ('contextWindow' in s) log('context after', { contextUsage: s.contextUsage, contextWindow: s.contextWindow });
    setStatus('Done');
  } catch (err) {
    const detail = describeError(err);
    log('ERROR', detail);
    console.error(err);
    let msg = `${err.name || 'Error'}: ${err.message}`;
    if (err.name === 'NotSupportedError') {
      msg += '\nThe model rejected an input/output type or language. Try a different output language or remove unsupported modalities.';
    } else if (err.name === 'QuotaExceededError') {
      msg += `\nrequested=${err.requested} contextWindow=${err.contextWindow}. Destroy and recreate the session, or shorten the input.`;
    } else if (err.name === 'InvalidStateError') {
      msg += '\nSession was destroyed or in an invalid state.';
    } else if (err.name === 'AbortError') {
      msg += '\nThe operation was aborted.';
    } else if (!('LanguageModel' in self)) {
      msg += '\nEnable chrome://flags/#optimization-guide-on-device-model and chrome://flags/#prompt-api-for-gemini-nano-multimodal-input.';
    }
    output.textContent = msg;
    hideProgress();
    setStatus('Error');
  } finally {
    describeBtn.disabled = false;
    stopBtn.disabled = true;
    activeController = null;
  }
});

log('page loaded', { ua: navigator.userAgent });
log('LanguageModel available?', 'LanguageModel' in self);
</script>
</body>
</html>
